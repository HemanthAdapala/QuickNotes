name: gravity_notes
description: "Gravity Notes - A modern, high-performance Android notes app built with Flutter using clean architecture, Material 3, SQLite, and Provider."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Local Persistence (SQLite)
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Helper Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

  # Premium UI & Styling
  google_fonts: ^6.2.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Advanced Productivity Dependencies
  flutter_markdown: ^0.7.1
  image_picker: ^1.0.7
  record: ^5.0.4
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.1
  timezone: ^0.9.2
  local_auth: ^2.2.0
  flutter_secure_storage: ^10.2.0
  encrypt: ^5.0.3
  pdf: ^3.12.0
  share_plus: ^13.1.0
  home_widget: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.2

dependency_overrides:
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
