name: quick_notes
description: "QuickNotes - A luxury, high-performance note-taking app built with Flutter."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Local Persistence (SQLite)
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # Helper Utilities
  uuid: ^4.3.3
  intl: ^0.20.2
  connectivity_plus: ^6.1.4

  # Premium UI & Styling
  google_fonts: ^8.1.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Advanced Productivity Dependencies
  flutter_markdown: ^0.7.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.0
  record: ^7.1.0
  audioplayers: ^6.4.0
  flutter_local_notifications: ^22.0.0
  permission_handler: ^12.0.3
  timezone: ^0.11.0
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.3.1
  encrypt: ^5.0.3
  pdf: ^3.12.0
  share_plus: ^13.1.0
  home_widget: ^0.9.1
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  flutter_inset_shadow: ^2.0.3
  flutter_animate: ^4.5.2
  lottie: ^3.1.2
  google_sign_in: ^6.2.1
  device_preview: ^3.0.0-prerelease3
  sqflite_common_ffi: ^2.4.2+1
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - google_fonts/
    - assets/icons/
    - assets/New Icons/
    - assets/New Icons/Selected/
    - assets/New Icons/Not Selected/
    - assets/app_bottom_navigation_bar_Icons/
    - assets/icons/bottom_navigation/
    - assets/Profile Icons/
    - assets/Settings Screen/
    - assets/stickers/
    - assets/animations/
    - DesignCode/LottieFiles/
    - DesignCode/Welcome Screens/

